name: CoreMetricSuite Universal Mobile Layout Injection

on:
  push:
    branches:
      - master  # Firmly locked to your master deployment branch

permissions:
  contents: write

jobs:
  inject-styles:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Current Repository Files
        uses: actions/checkout@v4

      - name: Inject High-Priority Universal Mobile Layout Rules
        run: |
          # 1. 100% Universal fluid math. Replaces static pixels with dynamic max-width percentages
          MOBILE_STYLE='<style type="text/css">@media screen and (max-width:900px){html,body{width:100%!important;max-width:100vw!important;overflow-x:hidden!important;margin:0!important;padding:0!important}main.container{display:flex!important;flex-direction:column!important;width:100%!important;max-width:100%!important;padding:0 12px!important;margin:8px auto!important;gap:16px!important;box-sizing:border-box!important}main.container>section.preview-stage{order:-1!important;width:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;margin:0 auto!important;box-sizing:border-box!important}main.container>section.panel{order:2!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important}.canvas-wrapper{width:75vw!important;height:133.33vw!important;max-width:290px!important;max-height:515px!important;margin:0 auto!important;box-sizing:border-box!important}#cms-ad-slot-top,#cms-ad-slot-1,.cms-medianet-box,.cms-ad-slot-1,.cms-ad-slot-2{width:100%!important;max-width:100%!important;height:auto!important;min-height:90px!important;display:block!important}.spec-table,.content-card div[style*="display: grid"]{grid-template-columns:1fr!important;width:100%!important}input,textarea,select{font-size:16px!important}}</style></body>'

          # 2. Scans tool directory layers dynamically to alter index structures safely right before runtime deployment
          find . -name "index.html" -type f | while read -r html_file; do
            echo "Processing application container layout for: $html_file"
            
            # Direct target override on the closing body tag boundary
            sed -i "s|</body>|${MOBILE_STYLE}|g" "$html_file"
          done

      - name: Deploy Modified High-Performance Output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated universal fluid mobile responsive engine injection [CI SKIP]"
          file_pattern: "**/index.html"
