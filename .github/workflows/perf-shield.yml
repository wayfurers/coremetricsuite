name: Auto-Inject Performance Layout Shields

on:
  push:
    branches: [ master, main ]

jobs:
  patch-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants full security permissions to write to repository files
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Inject CSS Layout Shields into HTML Headers
        run: |
          SHIELD="<style>#cms-ad-slot-top,#cms-ad-slot-1,.cms-medianet-box{display:block!important;height:250px!important;min-height:250px!important;max-height:250px!important;overflow:hidden!important;background-color:var(--cms-surface-alt)}</style></head>"
          
          find . -name "*.html" -type f | while read -r file; do
            if grep -q "<\/head>" "$file" && ! grep -q "cms-ad-slot-top" "$file"; then
              perl -pi -e "s|<\/head>|${SHIELD}|g" "$file"
              echo "Patched layout controls into: $file"
            fi
          done

      - name: Commit and Push Optimizations Live Natively
        run: |
          # Check if any HTML files were actually modified before pushing
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@://github.com"
            git add .
            git commit -m "⚡ Performance optimization: Locked ad layout boundaries against CLS"
            git push
            echo "Successfully pushed optimized layout updates to production!"
          else
            echo "No layout modifications required. All files are fully protected."
          fi
