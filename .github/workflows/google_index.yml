name: Google Indexing API Automation

on:
  push:
    branches:
      - main  # Triggers whenever you push changes to your main branch
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  index-urls:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Google API Libraries
      run: |
        pip install google-api-python-client google-auth

    - name: Create Temporary Key File
      run: |
        echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT }}' > service_account.json

    - name: Run Indexing Script
      run: |
        python - <<EOF
        import json
        from google.oauth2 import service_account
        from googleapiclient.discovery import build
        from googleapiclient.errors import HttpError

        SCOPES = ['https://googleapis.com']
        try:
            creds = service_account.Credentials.from_service_account_file('service_account.json', scopes=SCOPES)
            service = build('indexing', 'v3', credentials=creds)
            
            with open('urls.txt', 'r') as f:
                urls = [line.strip() for line in f if line.strip()]
            
            print(f"Found {len(urls)} URLs. Pushing to Google Indexing API...")
            
            for url in urls:
                body = {'url': url, 'type': 'URL_UPDATED'}
                try:
                    service.urlNotifications().publish(body=body).execute()
                    print(f" Successfully pinged: {url}")
                except HttpError as e:
                    print(f"❌ Error for {url}: {e.content.decode('utf-8')}")
        except Exception as e:
            print(f"Initialization Error: {e}")
        EOF
