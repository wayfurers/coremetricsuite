name: Generate XML Sitemap

on:
  push:
    branches:
      - master

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap Job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Bug-Proof Cache Buster
        run: |
          # 1. Safely calculate individual content fingerprints
          if [ -f "config.js" ]; then
            CONFIG_HASH=$(md5sum config.js | cut -c1-8)
            echo "🔄 Target Hash config.js -> $CONFIG_HASH"
          else
            CONFIG_HASH="1.0.0"
          fi

          if [ -f "global.min.js" ]; then
            GLOBAL_HASH=$(md5sum global.min.js | cut -c1-8)
            echo "⚡ Target Hash global.min.js -> $GLOBAL_HASH"
          else
            GLOBAL_HASH="1.0.0"
          fi

          # 2. Seamlessly execute clean replacement sweeps across every single template file
          find . -name "*.html" -type f | while read -r file; do
            perl -pi -e "s|config\.js\?v=[^\"]*|config.js?v=$CONFIG_HASH|g" "$file"
            perl -pi -e "s|global\.min\.js\?v=[^\"]*|global.min.js?v=$GLOBAL_HASH|g" "$file"
            echo "Successfully updated script cache values in: $file"
          done

      - name: Auto Generate Sitemap From HTML Files
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://coremetricsuite.com/
          drop-html-extension: true

      - name: Commit and Push Updates to Branch
        run: |
          git config --global user.name 'Sitemap Bot'
          git config --global user.email 'bot@github.com'
          # Stage both the sitemap changes and any updated HTML files
          git add sitemap.xml *.html
          git commit -am "Deploy updated sitemap.xml and automated cache bust" || echo "No changes to commit"
          git push
